<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">Agent Skills for Media Creation</title>
  <desc id="desc">Skills that teach a coding agent to direct AI video. On the right, the six sections of a MiniMax H3 structured brief, the format the skills write.</desc>

  <rect width="1200" height="400" rx="26" fill="#101114"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#E8B04A">AGENT SKILLS  /  AI VIDEO AND IMAGE</text>
    <text x="62" y="170" font-size="62" font-weight="700" fill="#F2EEE6">Agent Skills for</text>
    <text x="62" y="240" font-size="62" font-weight="700" fill="#F2EEE6">Media Creation</text>
    <text x="64" y="292" font-size="24" fill="#B9B4AA">Teach your coding agent to direct</text>
    <text x="64" y="324" font-size="24" fill="#B9B4AA">MiniMax H3, ComfyUI and SimpliGen.</text>
  </g>

  <!-- timecode ruler: the recurring motif -->
  <g id="ruler" stroke="#3A3E47" stroke-width="2">
    <path d="M64 356 H640"/>
    <path d="M64 348 V364 M136 352 V360 M208 352 V360 M280 352 V360 M352 348 V364 M424 352 V360 M496 352 V360 M568 352 V360 M640 348 V364"/>
  </g>
  <rect x="64" y="353" width="288" height="6" rx="3" fill="#E8B04A"/>

  <g id="project-proof" transform="translate(712 44)">
    <rect width="424" height="312" rx="18" fill="#1A1C21" stroke="#2C2F37" stroke-width="2"/>
    <text x="28" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1" fill="#8A8F98">H3 BRIEF  /  REFERENCE TO VIDEO</text>
    <path d="M28 60 H396" stroke="#2C2F37" stroke-width="2"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#F2EEE6">
      <text x="56" y="98">subject_definitions</text>
      <text x="56" y="136">summary</text>
      <text x="56" y="174">retention_analysis</text>
      <text x="56" y="212">detailed_description</text>
      <text x="56" y="250">overall_soundscape</text>
      <text x="56" y="288">non_diegetic_music</text>
