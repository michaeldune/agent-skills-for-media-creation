    <g fill="#3A3E47">
      <rect x="28" y="84" width="14" height="14" rx="3"/>
      <rect x="28" y="122" width="14" height="14" rx="3"/>
      <rect x="28" y="160" width="14" height="14" rx="3"/>
      <rect x="28" y="236" width="14" height="14" rx="3"/>
      <rect x="28" y="274" width="14" height="14" rx="3"/>
    </g>
    <rect x="28" y="198" width="14" height="14" rx="3" fill="#E8B04A"/>
    <text x="318" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#E8B04A">[Shot 1]</text>
